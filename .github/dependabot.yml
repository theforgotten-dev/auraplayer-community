version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "13:17"
      timezone: America/Santiago
    open-pull-requests-limit: 1
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "13:17"
      timezone: America/Santiago
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
